<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active & Passive Voice - Nk Study Lab</title>
  <meta name="description" content="Active and Passive Voice menu with separate cards in pure Hindi at Nk Study Lab.">
  <link rel="icon" type="image/png" href="https://nkfactsstudy-max.github.io/nk-study-lab/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #F7F8FA;
      --border: #E5E8EE;
      --text: #1A1F2B;
      --text-dim: #687280;
      --active-color: #2563EB;
      --passive-color: #0D9488;
      --card-shadow: 0 4px 12px rgba(0,0,0,0.03);
    }
    [data-theme="dark"] {
      --bg: #0A0E14;
      --surface: #131A28;
      --border: #232B3D;
      --text: #E2E8F0;
      --text-dim: #8896AC;
      --active-color: #3B82F6;
      --passive-color: #14B8A6;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.7; padding-bottom: 3rem; }
    
    /* Header Bar */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.8rem 1.2rem; border-bottom: 1px solid var(--border); background: var(--bg);
      position: sticky; top:0; z-index: 100;
    }
    .back-btn {
      background: var(--surface); border: 1px solid var(--border);
      width: 38px; height: 38px; border-radius: 10px; display: flex;
      align-items: center; justify-content: center; text-decoration: none;
      color: var(--text); font-weight: bold; font-size: 1.1rem;
    }
    .site-title { font-size: 1.25rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .theme-toggle {
      background: var(--surface); border: 1px solid var(--border);
      width: 38px; height: 38px; border-radius: 10px; display: flex;
      align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem;
    }

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, #2563EB, #0D9488); color: #FFFFFF; text-align: center;
      padding: 2.2rem 1rem; margin-bottom: 1.5rem;
    }
    .hero-icon { font-size: 2.8rem; margin-bottom: 0.4rem; }
    .hero-title { font-size: 1.8rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-bottom: 0.2rem; }
    .hero-sub { font-size: 0.95rem; opacity: 0.9; }

    /* Main Container */
    .main-container { max-width: 750px; margin: 0 auto; padding: 0 1rem; }

    /* Intro Content Box */
    .intro-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.4rem; margin-bottom: 1.5rem;
      box-shadow: var(--card-shadow);
    }
    .box-title {
      font-size: 1.2rem; font-weight: 700; font-family: 'JetBrains Mono', monospace;
      color: var(--text); margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .para-text { font-size: 0.98rem; color: var(--text-dim); line-height: 1.7; }

    /* Category Cards List */
    .voice-grid { display: flex; flex-direction: column; gap: 1.2rem; }
    
    .voice-card {
      display: block; text-decoration: none; border-radius: 16px;
      padding: 1.5rem; color: #FFFFFF; position: relative; overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.2s ease;
    }
    .voice-card:active { transform: scale(0.98); }

    /* Card 1: Active Voice Style */
    .card-active-voice {
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
    }
    /* Card 2: Passive Voice Style */
    .card-passive-voice {
      background: linear-gradient(135deg, #0D9488, #0F766E);
    }

    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
    .card-icon { font-size: 2rem; }
    .card-badge {
      background: rgba(255,255,255,0.2); font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
      padding: 3px 10px; border-radius: 20px; font-weight: 700; backdrop-filter: blur(4px);
    }
    .card-title { font-size: 1.4rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; margin-bottom: 0.3rem; }
    .card-desc { font-size: 0.9rem; opacity: 0.92; line-height: 1.5; }
    .card-arrow { font-weight: 700; font-size: 0.9rem; margin-top: 1rem; display: inline-block; opacity: 0.9; }

  </style>
</head>
<body>

  <!-- Header Bar -->
  <header>
    <a href="Grammar.html" class="back-btn">←</a>
    <div class="site-title">Nk Study Lab</div>
    <div class="theme-toggle" id="themeBtn">🌙</div>
  </header>

  <!-- Hero Banner -->
  <div class="hero-banner">
    <div class="hero-icon">📢</div>
    <h1 class="hero-title">Active & Passive Voice</h1>
    <p class="hero-sub">learn & grow next level</p>
  </div>

  <div class="main-container">

    <!-- Overview Box -->
    <div class="intro-box">
      <div class="box-title">💡 Voice क्या है?</div>
      <p class="para-text">
        अंग्रेज़ी व्याकरण में <b>Voice</b> यह बताता है कि वाक्य में <b>कर्ता (Subject)</b> खुद काम कर रहा है या फिर <b>कर्म (Object)</b> पर काम हो रहा है। इसके मुख्य रूप से दो भेद होते हैं:
      </p>
    </div>

    <!-- Separate Cards for Active & Passive Voice -->
    <div class="voice-grid">

      <!-- Card 1: Active Voice -->
      <a href="voice-active.html" class="voice-card card-active-voice">
        <div class="card-head">
          <span class="card-icon">⚡</span>
          <span class="card-badge">PART 1</span>
        </div>
        <div class="card-title">1. Active Voice</div>
        </span>
      </a>

      <!-- Card 2: Passive Voice -->
      <a href="voice-passive.html" class="voice-card card-passive-voice">
        <div class="card-head">
          <span class="card-icon">🔄</span>
          <span class="card-badge">PART 2</span>
        </div>
        <div class="card-title">2. Passive Voice</div>
        <div class="card-d </div>
          </span>
      </a>

    </div>

  </div>

  <script>
    const themeBtn = document.getElementById('themeBtn');
    let currentTheme = localStorage.getItem('nkStudyLabTheme') || 'light';
    
    if(currentTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }

    themeBtn.addEventListener('click', () => {
      if(document.documentElement.getAttribute('data-theme') === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('nkStudyLabTheme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('nkStudyLabTheme', 'dark');
        themeBtn.textContent = '☀️';
      }
    });
  </script>

</body>
</html>
