<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoken English Course - Nk Study Lab</title>
  <meta name="description" content="Learn Spoken English Step by Step: Daily Use Sentences, Advanced Level, Vocabulary, Listening at Nk Study Lab.">
  <link rel="icon" type="image/png" href="https://nkfactsstudy-max.github.io/nk-study-lab/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFFFFF;
      --surface: #F7F8FA;
      --border: #E5E8EE;
      --text: #1A1F2B;
      --text-dim: #687280;
      --blue: #2563EB;
      --blue-card: #2563EB;
      --red-card: #DC2626;
      --purple-card: #9333EA;
      --green-card: #16A34A;
    }
    [data-theme="dark"] {
      --bg: #0A0E14;
      --surface: #131A28;
      --border: #232B3D;
      --text: #E2E8F0;
      --text-dim: #8896AC;
      --blue: #3B82F6;
      --blue-card: #3B82F6;
      --red-card: #EF4444;
      --purple-card: #A855F7;
      --green-card: #22C55E;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.6; }
    
    /* Top Header Bar */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.8rem 1.2rem; border-bottom: 1px solid var(--border); background: var(--bg);
      position: sticky; top:0; z-index: 100;
    }
    .back-btn {
      background: var(--surface); border: 1px solid var(--border);
      width: 38px; height: 38px; border-radius: 10px; display: flex;
      align-items: center; justify-content: center; text-decoration: none;
      color: var(--text); font-weight: bold; font-size: 1.1rem;
    }
    .site-title { font-size: 1.25rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .theme-toggle {
      background: var(--surface); border: 1px solid var(--border);
      width: 38px; height: 38px; border-radius: 10px; display: flex;
      align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem;
    }

    /* Hero Banner Section */
    .hero-banner {
      background: var(--blue); color: #FFFFFF; text-align: center;
      padding: 2.2rem 1rem; margin-bottom: 1.5rem;
    }
    .hero-icon { font-size: 2.8rem; margin-bottom: 0.4rem; }
    .hero-title { font-size: 2rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-bottom: 0.2rem; }
    .hero-sub { font-size: 0.95rem; opacity: 0.9; }

    /* Main Content Area */
    .main-container { max-width: 750px; margin: 0 auto; padding: 0 1rem 3rem; }

    .section-tag {
      font-size: 0.85rem; font-weight: 700; color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace; letter-spacing: 0.5px;
      margin-bottom: 1.2rem; text-transform: uppercase; display: flex; align-items: center; gap: 0.4rem;
    }

    /* Rectangular Card List (आयताकार डिब्बे) */
    .rect-card-list {
      display: flex; flex-direction: column; gap: 1rem;
    }

    .rect-card {
      border-radius: 14px; padding: 1.2rem 1.4rem; color: #FFFFFF;
      text-decoration: none; transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex; align-items: center; justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .rect-card:active { transform: scale(0.98); }
    
    .card-left { display: flex; align-items: center; gap: 1rem; }
    .card-icon { font-size: 2rem; }
    .card-info { display: flex; flex-direction: column; }
    .card-title { font-size: 1.25rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .card-desc { font-size: 0.85rem; opacity: 0.9; margin-top: 2px; }
    
    .card-arrow { font-size: 1.4rem; font-weight: bold; opacity: 0.8; }

    /* Card Background Colors */
    .rect-card.blue { background: var(--blue-card); }
    .rect-card.red { background: var(--red-card); }
    .rect-card.purple { background: var(--purple-card); }
    .rect-card.green { background: var(--green-card); }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html" class="back-btn">←</a>
    <div class="site-title">Nk Study Lab</div>
    <div class="theme-toggle" id="themeBtn">🌙</div>
  </header>

  <!-- Hero Section -->
  <div class="hero-banner">
    <div class="hero-icon">🗣️</div>
    <h1 class="hero-title">Spoken English</h1>
    <p class="hero-sub">Fluently bolna seekho step by step</p>
  </div>

  <div class="main-container">
    
    <div class="section-tag">📁 CATEGORY CHUNO</div>

    <!-- Rectangular Cards List -->
    <div class="rect-card-list">
      
      <!-- 1. Daily Uses Sentences Basics -->
      <a href="Basic.html" class="rect-card blue">
        <div class="card-left">
          <div class="card-icon">💬</div>
          <div class="card-info">
            <span class="card-title">Daily Use Sentences (Basics)</span>
            <span</span>
          </div>
        </div>
        <div class="card-arrow">→</div>
      </a>

      <!-- 2. Advanced Level -->
      <a href="advanced-spoken-1.html" class="rect-card red">
        <div class="card-left">
          <div class="card-icon">🚀</div>
          <div class="card-info">
            <span class="card-title">Advanced Level</span>
            <span class="card-desc">Advance English structures, phrases aur fluency tips</span>
          </div>
        </div>

      </a>
    </div>
</div>

  <script>
    const themeBtn = document.getElementById('themeBtn');
    let currentTheme = localStorage.getItem('nkStudyLabTheme') || 'light';
    
    if(currentTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️';
    }

    themeBtn.addEventListener('click', () => {
      if(document.documentElement.getAttribute('data-theme') === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('nkStudyLabTheme', 'light');
        themeBtn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('nkStudyLabTheme', 'dark');
        themeBtn.textContent = '☀️';
      }
    });
  </script>

</body>
</html>
