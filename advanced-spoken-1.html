<script>
const sentences=[{"id": 1, "category": "Daily Conversation", "en": "I was just about to call you.", "hi": "मैं बस तुम्हें फोन करने ही वाला था।"}, {"id": 2, "category": "Daily Conversation", "en": "Let me think about it for a moment.", "hi": "मुझे इस बारे में एक पल सोचने दो।"}, {"id": 3, "category": "Daily Conversation", "en": "That sounds like a reasonable idea.", "hi": "यह एक उचित विचार लगता है।"}, {"id": 4, "category": "Daily Conversation", "en": "I didn't quite catch what you said.", "hi": "तुमने जो कहा, वह मुझे ठीक से समझ नहीं आया।"}, {"id": 5, "category": "Daily Conversation", "en": "Could you explain that in a little more detail?", "hi": "क्या तुम इसे थोड़ा विस्तार से समझा सकते हो?"}, {"id": 6, "category": "Daily Conversation", "en": "I will get back to you as soon as possible.", "hi": "मैं जितनी जल्दी हो सके तुम्हें जवाब दूँगा।"}, {"id": 7, "category": "Daily Conversation", "en": "I wasn't expecting to see you here.", "hi": "मुझे उम्मीद नहीं थी कि तुम यहाँ मिलोगे।"}, {"id": 8, "category": "Daily Conversation", "en": "It's been a while since we last met.", "hi": "हमें पिछली बार मिले काफी समय हो गया है।"}, {"id": 9, "category": "Daily Conversation", "en": "I appreciate you taking the time to help me.", "hi": "मेरी मदद के लिए समय निकालने की मैं सराहना करता हूँ।"}, {"id": 10, "category": "Daily Conversation", "en": "Let's discuss this when we are both free.", "hi": "जब हम दोनों खाली हों, तब इस पर बात करते हैं।"}, {"id": 11, "category": "Daily Conversation", "en": "I would rather stay home tonight.", "hi": "मैं आज रात घर पर रहना ज्यादा पसंद करूँगा।"}, {"id": 12, "category": "Daily Conversation", "en": "Please let me know if anything changes.", "hi": "अगर कुछ बदले तो मुझे जरूर बताना।"}, {"id": 13, "category": "Daily Conversation", "en": "I have been meaning to ask you something.", "hi": "मैं तुमसे कुछ पूछना चाह रहा था।"}, {"id": 14, "category": "Daily Conversation", "en": "There is no need to rush into a decision.", "hi": "फैसला लेने में जल्दबाजी करने की जरूरत नहीं है।"}, {"id": 15, "category": "Daily Conversation", "en": "I completely understand your point of view.", "hi": "मैं तुम्हारा नजरिया पूरी तरह समझता हूँ।"}, {"id": 16, "category": "Daily Conversation", "en": "That is not exactly what I meant.", "hi": "मेरा मतलब ठीक-ठीक वह नहीं था।"}, {"id": 17, "category": "Daily Conversation", "en": "I will keep that in mind from now on.", "hi": "मैं अब से इस बात का ध्यान रखूँगा।"}, {"id": 18, "category": "Daily Conversation", "en": "Would you mind repeating that once?", "hi": "क्या तुम इसे एक बार फिर दोहराओगे?"}, {"id": 19, "category": "Daily Conversation", "en": "I am glad we had this conversation.", "hi": "मुझे खुशी है कि हमारी यह बातचीत हुई।"}, {"id": 20, "category": "Daily Conversation", "en": "Let's make the most of our time together.", "hi": "आओ, साथ बिताए समय का पूरा फायदा उठाएँ।"}, {"id": 21, "category": "Opinions & Discussion", "en": "From my perspective, the plan needs improvement.", "hi": "मेरे नजरिए से इस योजना में सुधार की जरूरत है।"}, {"id": 22, "category": "Opinions & Discussion", "en": "I see your point, but I have a different opinion.", "hi": "मैं तुम्हारी बात समझता हूँ, लेकिन मेरी राय अलग है।"}, {"id": 23, "category": "Opinions & Discussion", "en": "There is more to this issue than meets the eye.", "hi": "इस मामले में दिखाई देने वाली बातों से कहीं ज्यादा है।"}, {"id": 24, "category": "Opinions & Discussion", "en": "I would argue that practice matters more than talent.", "hi": "मैं कहूँगा कि अभ्यास प्रतिभा से ज्यादा मायने रखता है।"}, {"id": 25, "category": "Opinions & Discussion", "en": "That conclusion is based on limited information.", "hi": "यह निष्कर्ष सीमित जानकारी पर आधारित है।"}, {"id": 26, "category": "Opinions & Discussion", "en": "We should consider the long-term consequences.", "hi": "हमें लंबे समय के परिणामों पर विचार करना चाहिए।"}, {"id": 27, "category": "Opinions & Discussion", "en": "I am not entirely convinced by that argument.", "hi": "मैं उस तर्क से पूरी तरह सहमत नहीं हूँ।"}, {"id": 28, "category": "Opinions & Discussion", "en": "Could you provide an example to support your claim?", "hi": "क्या तुम अपनी बात के समर्थन में उदाहरण दे सकते हो?"}, {"id": 29, "category": "Opinions & Discussion", "en": "It depends on how you look at the situation.", "hi": "यह इस बात पर निर्भर करता है कि तुम स्थिति को कैसे देखते हो।"}, {"id": 30, "category": "Opinions & Discussion", "en": "I agree with you to a certain extent.", "hi": "मैं एक हद तक तुमसे सहमत हूँ।"}, {"id": 31, "category": "Opinions & Discussion", "en": "We need to separate facts from assumptions.", "hi": "हमें तथ्यों और धारणाओं को अलग रखना चाहिए।"}, {"id": 32, "category": "Opinions & Discussion", "en": "That is a valid concern worth discussing.", "hi": "यह एक उचित चिंता है जिस पर चर्चा होनी चाहिए।"}, {"id": 33, "category": "Opinions & Discussion", "en": "I would like to hear the other side of the story.", "hi": "मैं कहानी का दूसरा पक्ष भी सुनना चाहूँगा।"}, {"id": 34, "category": "Opinions & Discussion", "en": "Let's not jump to conclusions too quickly.", "hi": "आओ, बहुत जल्दी किसी नतीजे पर न पहुँचें।"}, {"id": 35, "category": "Opinions & Discussion", "en": "The evidence seems to support your explanation.", "hi": "सबूत तुम्हारी व्याख्या का समर्थन करते दिखते हैं।"}, {"id": 36, "category": "Opinions & Discussion", "en": "I respect your opinion even though I disagree.", "hi": "असहमत होने के बावजूद मैं तुम्हारी राय का सम्मान करता हूँ।"}, {"id": 37, "category": "Opinions & Discussion", "en": "There are several ways to approach this problem.", "hi": "इस समस्या को हल करने के कई तरीके हैं।"}, {"id": 38, "category": "Opinions & Discussion", "en": "In other words, we need a more practical solution.", "hi": "दूसरे शब्दों में, हमें अधिक व्यावहारिक समाधान चाहिए।"}, {"id": 39, "category": "Opinions & Discussion", "en": "That is an interesting point to bring up.", "hi": "यह उठाने के लिए एक दिलचस्प बात है।"}, {"id": 40, "category": "Opinions & Discussion", "en": "Let's focus on the issue rather than the person.", "hi": "व्यक्ति के बजाय मुद्दे पर ध्यान दें।"}, {"id": 41, "category": "Confidence & Fluency", "en": "I am willing to learn from my mistakes.", "hi": "मैं अपनी गलतियों से सीखने के लिए तैयार हूँ।"}, {"id": 42, "category": "Confidence & Fluency", "en": "I feel more confident when I prepare in advance.", "hi": "पहले से तैयारी करने पर मुझे अधिक आत्मविश्वास महसूस होता है।"}, {"id": 43, "category": "Confidence & Fluency", "en": "I can handle this situation calmly.", "hi": "मैं इस स्थिति को शांति से संभाल सकता हूँ।"}, {"id": 44, "category": "Confidence & Fluency", "en": "I am getting better at expressing my thoughts.", "hi": "मैं अपने विचार व्यक्त करने में बेहतर हो रहा हूँ।"}, {"id": 45, "category": "Confidence & Fluency", "en": "I would like to give it a try.", "hi": "मैं इसे आजमाना चाहूँगा।"}, {"id": 46, "category": "Confidence & Fluency", "en": "I will not let fear hold me back.", "hi": "मैं डर को अपनी प्रगति में बाधा नहीं बनने दूँगा।"}, {"id": 47, "category": "Confidence & Fluency", "en": "I have made progress, even if it is gradual.", "hi": "भले ही धीरे-धीरे, मैंने प्रगति की है।"}, {"id": 48, "category": "Confidence & Fluency", "en": "I am learning to speak without overthinking.", "hi": "मैं जरूरत से ज्यादा सोचे बिना बोलना सीख रहा हूँ।"}, {"id": 49, "category": "Confidence & Fluency", "en": "I trust myself to figure things out.", "hi": "मुझे भरोसा है कि मैं रास्ता निकाल लूँगा।"}, {"id": 50, "category": "Confidence & Fluency", "en": "Every conversation is an opportunity to improve.", "hi": "हर बातचीत बेहतर बनने का एक अवसर है।"}, {"id": 51, "category": "Confidence & Fluency", "en": "I am comfortable asking questions when I am unsure.", "hi": "अनिश्चित होने पर सवाल पूछने में मुझे सहजता है।"}, {"id": 52, "category": "Confidence & Fluency", "en": "I would rather try and learn than never begin.", "hi": "मैं कभी शुरू न करने के बजाय कोशिश करके सीखना पसंद करूँगा।"}, {"id": 53, "category": "Confidence & Fluency", "en": "I am proud of the effort I have put in.", "hi": "मैंने जो मेहनत की है, उस पर मुझे गर्व है।"}, {"id": 54, "category": "Confidence & Fluency", "en": "I can explain my ideas more clearly now.", "hi": "अब मैं अपने विचार ज्यादा स्पष्टता से समझा सकता हूँ।"}, {"id": 55, "category": "Confidence & Fluency", "en": "I am becoming more fluent with daily practice.", "hi": "रोज अभ्यास से मेरी बोलने की क्षमता बेहतर हो रही है।"}, {"id": 56, "category": "Confidence & Fluency", "en": "I do not need to be perfect to make progress.", "hi": "प्रगति करने के लिए मेरा पूर्ण होना जरूरी नहीं है।"}, {"id": 57, "category": "Confidence & Fluency", "en": "I can pause, think, and then respond.", "hi": "मैं रुककर सोच सकता हूँ और फिर जवाब दे सकता हूँ।"}, {"id": 58, "category": "Confidence & Fluency", "en": "I am ready to step outside my comfort zone.", "hi": "मैं अपनी सहज सीमा से बाहर कदम रखने के लिए तैयार हूँ।"}, {"id": 59, "category": "Confidence & Fluency", "en": "I will keep practicing until it feels natural.", "hi": "जब तक यह स्वाभाविक न लगे, मैं अभ्यास करता रहूँगा।"}, {"id": 60, "category": "Confidence & Fluency", "en": "My confidence grows every time I speak.", "hi": "हर बार बोलने से मेरा आत्मविश्वास बढ़ता है।"}, {"id": 61, "category": "Work & Professional Life", "en": "I would like to clarify the main objective.", "hi": "मैं मुख्य उद्देश्य स्पष्ट करना चाहूँगा।"}, {"id": 62, "category": "Work & Professional Life", "en": "Could we schedule a meeting for tomorrow?", "hi": "क्या हम कल के लिए बैठक तय कर सकते हैं?"}, {"id": 63, "category": "Work & Professional Life", "en": "I will send you the updated version by evening.", "hi": "मैं शाम तक तुम्हें नया संस्करण भेज दूँगा।"}, {"id": 64, "category": "Work & Professional Life", "en": "Thank you for bringing this to my attention.", "hi": "इस ओर मेरा ध्यान दिलाने के लिए धन्यवाद।"}, {"id": 65, "category": "Work & Professional Life", "en": "I will take responsibility for my part.", "hi": "मैं अपनी जिम्मेदारी का हिस्सा निभाऊँगा।"}, {"id": 66, "category": "Work & Professional Life", "en": "Let's prioritize the most urgent tasks first.", "hi": "आओ, सबसे जरूरी कामों को पहले प्राथमिकता दें।"}, {"id": 67, "category": "Work & Professional Life", "en": "I need a little more time to complete the task.", "hi": "काम पूरा करने के लिए मुझे थोड़ा और समय चाहिए।"}, {"id": 68, "category": "Work & Professional Life", "en": "Please share the details at your convenience.", "hi": "सुविधा के अनुसार विवरण साझा कर दीजिए।"}, {"id": 69, "category": "Work & Professional Life", "en": "I will keep you informed about the progress.", "hi": "मैं आपको प्रगति के बारे में जानकारी देता रहूँगा।"}, {"id": 70, "category": "Work & Professional Life", "en": "We should set a realistic deadline.", "hi": "हमें एक व्यावहारिक समय-सीमा तय करनी चाहिए।"}, {"id": 71, "category": "Work & Professional Life", "en": "I appreciate your feedback on this project.", "hi": "इस प्रोजेक्ट पर आपकी प्रतिक्रिया की मैं सराहना करता हूँ।"}, {"id": 72, "category": "Work & Professional Life", "en": "Could you walk me through the process?", "hi": "क्या आप मुझे पूरी प्रक्रिया समझा सकते हैं?"}, {"id": 73, "category": "Work & Professional Life", "en": "Let's review the results before making changes.", "hi": "बदलाव करने से पहले परिणामों की समीक्षा करें।"}, {"id": 74, "category": "Work & Professional Life", "en": "I am available if you need any assistance.", "hi": "अगर आपको मदद चाहिए, तो मैं उपलब्ध हूँ।"}, {"id": 75, "category": "Work & Professional Life", "en": "We need to communicate more effectively as a team.", "hi": "हमें टीम के रूप में अधिक प्रभावी संवाद करना होगा।"}, {"id": 76, "category": "Work & Professional Life", "en": "I will follow up on this issue tomorrow.", "hi": "मैं कल इस मामले पर दोबारा जानकारी लूँगा।"}, {"id": 77, "category": "Work & Professional Life", "en": "Please let me know if the schedule changes.", "hi": "समय-सारणी बदले तो मुझे बता दीजिए।"}, {"id": 78, "category": "Work & Professional Life", "en": "I believe we can meet the target together.", "hi": "मुझे विश्वास है कि हम मिलकर लक्ष्य हासिल कर सकते हैं।"}, {"id": 79, "category": "Work & Professional Life", "en": "Let's make sure everyone understands their role.", "hi": "आओ, सुनिश्चित करें कि सभी अपनी भूमिका समझते हैं।"}, {"id": 80, "category": "Work & Professional Life", "en": "I will share a summary after the discussion.", "hi": "चर्चा के बाद मैं सारांश साझा करूँगा।"}, {"id": 81, "category": "Polite Requests", "en": "Would it be possible to move this to another day?", "hi": "क्या इसे किसी दूसरे दिन रखना संभव होगा?"}, {"id": 82, "category": "Polite Requests", "en": "Could you spare a few minutes to help me?", "hi": "क्या आप मेरी मदद के लिए कुछ मिनट निकाल सकते हैं?"}, {"id": 83, "category": "Polite Requests", "en": "I would be grateful if you could explain this.", "hi": "अगर आप इसे समझा दें, तो मैं आभारी रहूँगा।"}, {"id": 84, "category": "Polite Requests", "en": "Would you mind speaking a little more slowly?", "hi": "क्या आप थोड़ा धीरे बोलेंगे?"}, {"id": 85, "category": "Polite Requests", "en": "Could you please point me in the right direction?", "hi": "क्या आप मुझे सही दिशा बता सकते हैं?"}, {"id": 86, "category": "Polite Requests", "en": "I was wondering if you could give me some advice.", "hi": "मैं सोच रहा था कि क्या आप मुझे कुछ सलाह दे सकते हैं।"}, {"id": 87, "category": "Polite Requests", "en": "Please feel free to correct me if I am wrong.", "hi": "अगर मैं गलत हूँ, तो बेझिझक मुझे सुधारें।"}, {"id": 88, "category": "Polite Requests", "en": "Would you be kind enough to check this for me?", "hi": "क्या आप कृपया इसे मेरे लिए जाँच सकते हैं?"}, {"id": 89, "category": "Polite Requests", "en": "I would appreciate it if you kept this confidential.", "hi": "अगर आप इसे गोपनीय रखें, तो मैं आभारी रहूँगा।"}, {"id": 90, "category": "Polite Requests", "en": "Could we possibly discuss this at a later time?", "hi": "क्या हम इस पर बाद में चर्चा कर सकते हैं?"}, {"id": 91, "category": "Polite Requests", "en": "Please let me finish before you respond.", "hi": "कृपया जवाब देने से पहले मुझे अपनी बात पूरी करने दें।"}, {"id": 92, "category": "Polite Requests", "en": "Would you mind giving me a little more context?", "hi": "क्या आप मुझे थोड़ा और संदर्भ दे सकते हैं?"}, {"id": 93, "category": "Polite Requests", "en": "I hope you do not mind me asking.", "hi": "मुझे उम्मीद है कि आपको मेरे पूछने से बुरा नहीं लगेगा।"}, {"id": 94, "category": "Polite Requests", "en": "Could you help me understand what went wrong?", "hi": "क्या आप मुझे समझने में मदद करेंगे कि क्या गलत हुआ?"}, {"id": 95, "category": "Polite Requests", "en": "I would like to request a small favour.", "hi": "मैं आपसे एक छोटी-सी मदद माँगना चाहूँगा।"}, {"id": 96, "category": "Polite Requests", "en": "Please let me know what works best for you.", "hi": "आपके लिए जो सबसे अच्छा हो, मुझे बता दीजिए।"}, {"id": 97, "category": "Polite Requests", "en": "Would you be able to send it by Friday?", "hi": "क्या आप इसे शुक्रवार तक भेज पाएँगे?"}, {"id": 98, "category": "Polite Requests", "en": "I am sorry to bother you, but I need some help.", "hi": "परेशान करने के लिए माफ कीजिए, मुझे थोड़ी मदद चाहिए।"}, {"id": 99, "category": "Polite Requests", "en": "May I make one suggestion before we decide?", "hi": "क्या फैसले से पहले मैं एक सुझाव दे सकता हूँ?"}, {"id": 100, "category": "Polite Requests", "en": "Thank you for your patience and understanding.", "hi": "आपके धैर्य और समझ के लिए धन्यवाद।"}, {"id": 101, "category": "Problem Solving", "en": "Let's identify the root cause before fixing it.", "hi": "इसे ठीक करने से पहले मूल कारण पहचानें।"}, {"id": 102, "category": "Problem Solving", "en": "We may need to look at this from another angle.", "hi": "हमें इसे दूसरे नजरिए से देखना पड़ सकता है।"}, {"id": 103, "category": "Problem Solving", "en": "The simplest solution is not always the best one.", "hi": "सबसे आसान समाधान हमेशा सबसे अच्छा नहीं होता।"}, {"id": 104, "category": "Problem Solving", "en": "Let's break the problem into smaller steps.", "hi": "आओ, समस्या को छोटे-छोटे चरणों में बाँटें।"}, {"id": 105, "category": "Problem Solving", "en": "We should test the idea before applying it widely.", "hi  "category": "Goals & Motivation", "en": "I am building habits that support my future.", "hi": "मैं ऐसी आदतें बना रहा हूँ जो मेरे भविष्य में मदद करेंगी।"}, {"id": 157, "category": "Goals & Motivation", "en": "I do not compare my journey with everyone else's.", "hi": "मैं अपनी यात्रा की तुलना हर किसी से नहीं करता।"}, {"id": 158, "category": "Goals & Motivation", "en": "I will keep going even when progress feels slow.", "hi": "प्रगति धीमी लगे तब भी मैं आगे बढ़ता रहूँगा।"}, {"id": 159, "category": "Goals & Motivation", "en": "Every focused hour brings me closer to my goal.", "hi": "हर एकाग्र घंटे से मैं अपने लक्ष्य के करीब पहुँचता हूँ।"}, {"id": 160, "category": "Goals & Motivation", "en": "I want my actions to match my intentions.", "hi": "मैं चाहता हूँ कि मेरे काम मेरे इरादों के अनुरूप हों।"}, {"id": 161, "category": "Travel & Situations", "en": "Could you tell me the quickest way to get there?", "hi": "क्या आप वहाँ पहुँचने का सबसे तेज रास्ता बता सकते हैं?"}, {"id": 162, "category": "Travel & Situations", "en": "I seem to have taken the wrong turn.", "hi": "लगता है मैंने गलत मोड़ ले लिया है।"}, {"id": 163, "category": "Travel & Situations", "en": "How long does it usually take to reach the station?", "hi": "स्टेशन पहुँचने में आमतौर पर कितना समय लगता है?"}, {"id": 164, "category": "Travel & Situations", "en": "I would like to confirm my reservation.", "hi": "मैं अपनी बुकिंग की पुष्टि करना चाहूँगा।"}, {"id": 165, "category": "Travel & Situations", "en": "Is there another route in case of traffic?", "hi": "ट्रैफिक होने पर क्या कोई दूसरा रास्ता है?"}, {"id": 166, "category": "Travel & Situations", "en": "Could you recommend a place that locals enjoy?", "hi": "क्या आप ऐसी जगह सुझा सकते हैं जहाँ स्थानीय लोग जाना पसंद करते हैं?"}, {"id": 167, "category": "Travel & Situations", "en": "I would prefer a window seat if possible.", "hi": "अगर संभव हो तो मैं खिड़की वाली सीट पसंद करूँगा।"}, {"id": 168, "category": "Travel & Situations", "en": "Please let me know when we arrive.", "hi": "हम पहुँचें तो कृपया मुझे बता दीजिए।"}, {"id": 169, "category": "Travel & Situations", "en": "I have misplaced my ticket and need some assistance.", "hi": "मेरा टिकट कहीं खो गया है और मुझे मदद चाहिए।"}, {"id": 170, "category": "Travel & Situations", "en": "Is this bus heading towards the city centre?", "hi": "क्या यह बस शहर के केंद्र की ओर जा रही है?"}, {"id": 171, "category": "Travel & Situations", "en": "I would like to avoid the busiest hours.", "hi": "मैं सबसे ज्यादा भीड़ वाले समय से बचना चाहूँगा।"}, {"id": 172, "category": "Travel & Situations", "en": "Could you show me where the entrance is?", "hi": "क्या आप मुझे प्रवेश द्वार दिखा सकते हैं?"}, {"id": 173, "category": "Travel & Situations", "en": "I have a little luggage to carry.", "hi": "मेरे पास ले जाने के लिए थोड़ा सामान है।"}, {"id": 174, "category": "Travel & Situations", "en": "The weather turned out to be better than expected.", "hi": "मौसम उम्मीद से बेहतर निकला।"}, {"id": 175, "category": "Travel & Situations", "en": "We should leave early to avoid delays.", "hi": "देरी से बचने के लिए हमें जल्दी निकलना चाहिए।"}, {"id": 176, "category": "Travel & Situations", "en": "Would you mind helping me find this address?", "hi": "क्या आप यह पता ढूँढ़ने में मेरी मदद करेंगे?"}, {"id": 177, "category": "Travel & Situations", "en": "I would like to know the total fare beforehand.", "hi": "मैं पहले से कुल किराया जानना चाहूँगा।"}, {"id": 178, "category": "Travel & Situations", "en": "Please tell me if there are any changes to the schedule.", "hi": "समय-सारणी में बदलाव हो तो मुझे बता दीजिए।"}, {"id": 179, "category": "Travel & Situations", "en": "I need a moment to check the directions.", "hi": "मुझे रास्ता जाँचने के लिए एक पल चाहिए।"}, {"id": 180, "category": "Travel & Situations", "en": "Everything went smoothly despite the delay.", "hi": "देरी के बावजूद सब कुछ ठीक से हो गया।"}, {"id": 181, "category": "Technology & Learning", "en": "I am trying to understand how this feature works.", "hi": "मैं समझने की कोशिश कर थिति में मैंने एक कॉपी सेव कर ली है।"}, {"id": 194, "category": "Technology & Learning", "en": "Could you show me a simpler way to do this?", "hi": "क्या आप मुझे इसे करने का आसान तरीका दिखा सकते हैं?"}, {"id": 195, "category": "Technology & Learning", "en": "I am still getting familiar with this tool.", "hi": "मैं अभी इस टूल को अच्छी तरह समझ रहा हूँ।"}, {"id": 196, "category": "Technology & Learning", "en": "The instructions were clear, but one step was missing.", "hi": "निर्देश स्पष्ट थे, लेकिन एक चरण छूट गया था।"}, {"id": 197, "category": "Technology & Learning", "en": "I will document the steps so I can repeat them later.", "hi": "मैं चरणों को लिख लूँगा ताकि बाद में दोहरा सकूँ।"}, {"id": 198, "category": "Technology & Learning", "en": "A reliable internet connection makes this much easier.", "hi": "विश्वसनीय इंटरनेट कनेक्शन से यह काफी आसान हो जाता है।"}, {"id": 199, "category": "Technology & Learning", "en": "I want to learn the fundamentals before using advanced tools.", "hi": "एडवांस टूल्स इस्तेमाल करने से पहले मैं बुनियादी बातें सीखना चाहता हूँ।"}, {"id": 200, "category": "Technology & Learning", "en": "I will only test security on systems I am allowed to use.", "hi": "मैं सुरक्षा परीक्षण केवल उन्हीं सिस्टम पर करूँगा जिनकी अनुमति है।"}];const perPage=20;let pageNo=1,selectedCategory='all',query='';const $=id=>document.getElementById(id);const categories=[...new Set(sentences.map(s=>s.category))];
categories.forEach(c=>{const op=document.createElement('option');op.value=c;op.textContent=c;$('category').appendChild(op)});
function renderPills(){$('pills').innerHTML='';[['all','All'],...categories.map(c=>[c,c])].forEach(([value,label])=>{const b=document.createElement('button');b.className='pill'+(selectedCategory===value?' active':'');b.textContent=label;b.onclick=()=>{selectedCategory=value;$('category').value=value;pageNo=1;renderPills();render()};$('pills').appendChild(b)})}
function filtered(){return sentences.filter(s=>(selectedCategory==='all'||s.category===selectedCategory)&&(!query||(s.en+' '+s.hi+' '+s.category).toLowerCase().includes(query.toLowerCase())))}
function render(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/perPage));pageNo=Math.min(pageNo,pages);const start=(pageNo-1)*perPage;$('list').innerHTML='';if(!rows.length){$('list').innerHTML='<div class="empty">No sentences found. Try another search.</div>'}
rows.slice(start,start+perPage).forEach(s=>{const card=document.createElement('article');card.className='sentence';card.innerHTML=`<div class="sentence-top"><span class="num">SENTENCE ${s.id}</span><span class="tag">${s.category}</span></div><p class="en"></p><p class="hi"></p><div class="actions"><button class="smallbtn copy">📋 Copy</button><button class="smallbtn speak">🔊 Listen</button></div>`;card.querySelector('.en').textContent=s.en;card.querySelector('.hi').textContent=s.hi;card.querySelector('.copy').onclick=async()=>{try{await navigator.clipboard.writeText(s.en+' — '+s.hi);card.querySelector('.copy').textContent='✓ Copied'}catch(e){alert(s.en+'\\n'+s.hi)}};card.querySelector('.speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('Speech is not supported in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.en);u.lang='en-US';speechSynthesis.speak(u)};$('list').appendChild(card)});
$('pageInfo').textContent=`Page ${pageNo} of ${pages}`;$('prev').disabled=pageNo<=1;$('next').disabled=pageNo>=pages}
$('search').addEventListener('input',e=>{query=e.target.value;pageNo=1;render()});$('category').addEventListener('change',e=>{selectedCategory=e.target.value;pageNo=1;renderPills();render()});$('prev').onclick=()=>{pageNo--;render();window.scrollTo({top:0,behavior:'smooth'})};$('next').onclick=()=>{pageNo++;render();window.scrollTo({top:0,behavior:'smooth'})};
$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');$('themeBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';localStorage.setItem('nk-theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('nk-theme')==='dark'){document.body.classList.add('dark');$('themeBtn').textContent='☀️'}renderPills();render();
</script></body></html>
