<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding क्या है? — NK Study Lab</title>
<meta name="description" content="Coding क्या है, कैसे शुरू करें और क्यों सीखें? आसान हिंदी में समझो, NK Study Lab पर।">
<link rel="canonical" href="https://nkfactsstudy-max.github.io/nk-study-lab/coding.html">
<script>
  (function(){
    var saved = localStorage.getItem('nkStudyLabTheme');
    if(saved === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F7F8FA;
    --border:#E5E8EE;
    --text:#1A1F2B;
    --text-dim:#6B7280;
    --navbar-bg:rgba(255,255,255,0.92);
    --topic:#5cb904;
    --topic-dark:#43cc03;
  }
  [data-theme="dark"]{
    --bg:#0A0E14;
    --surface:#131A28;
    --border:#232B3D;
    --text:#E4E9F2;
    --text-dim:#8B96AC;
    --navbar-bg:rgba(10,14,20,0.92);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.6;
    transition:background .25s ease, color .25s ease;
  }
  a{text-decoration:none;color:inherit;}

  .theme-toggle{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);
    border:1px solid var(--border);
    font-size:15px;cursor:pointer;
    margin-left:auto;
  }
  .theme-toggle:active{ transform:scale(0.92); }

  .topbar{
    position:sticky;top:0;z-index:50;
    background:var(--navbar-bg);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 18px;
    display:flex;align-items:center;gap:14px;
    transition:background .25s ease, border-color .25s ease;
  }
  .back-btn{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);
    font-size:16px;flex-shrink:0;
  }
  .topbar-title{
    font-family:'JetBrains Mono',monospace;
    font-weight:800;font-size:16px;
  }

  .topic-banner{
    background:linear-gradient(135deg,var(--topic),var(--topic-dark));
    padding:32px 20px;
    text-align:center;
    color:#fff;
  }
  .topic-emoji{font-size:40px;margin-bottom:10px;}
  .topic-title{
    font-family:'JetBrains Mono',monospace;
    font-weight:800;font-size:24px;margin-bottom:6px;
  }
  .topic-sub{font-size:13px;opacity:0.9;}

  /* POST CONTENT */
  .post-wrap{
    max-width:680px;margin:0 auto;
    padding:24px 20px 60px;
  }
  .loading-text{color:var(--text-dim);font-size:13px;text-align:center;padding:40px 0;}

  .post-article-title{
    font-size:21px;font-weight:800;color:var(--text);
    line-height:1.4;margin-bottom:10px;
  }
  .post-article-date{
    font-size:12px;color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    margin-bottom:22px;
    display:flex;align-items:center;gap:6px;
  }

  /* Blogger post HTML content ko site theme mein fit karna */
  .post-article-body{
    font-size:15px;color:var(--text);line-height:1.85;
  }
  .post-article-body p{ margin-bottom:16px; }
  .post-article-body img{
    max-width:100%;height:auto;border-radius:12px;margin:16px 0;
    display:block;
  }
  .post-article-body h1, .post-article-body h2, .post-article-body h3, .post-article-body h4{
    color:var(--text);font-weight:800;margin:24px 0 12px;line-height:1.4;
  }
  .post-article-body h2{ font-size:19px; }
  .post-article-body h3{ font-size:16.5px; }
  .post-article-body ul, .post-article-body ol{ margin:0 0 16px 20px; }
  .post-article-body li{ margin-bottom:8px; }
  .post-article-body a{ color:var(--topic);text-decoration:underline; }
  .post-article-body strong, .post-article-body b{ color:var(--text); }
  .post-article-body blockquote{
    border-left:3px solid var(--topic);
    background:var(--surface);
    padding:12px 16px;margin:16px 0;
    border-radius:0 8px 8px 0;
    color:var(--text-dim);
  }
  .post-article-body code{
    background:var(--surface);border:1px solid var(--border);
    padding:2px 6px;border-radius:5px;
    font-family:'JetBrains Mono',monospace;font-size:13px;
  }
  .post-article-body pre{
    background:var(--surface);border:1px solid var(--border);
    padding:14px;border-radius:10px;overflow-x:auto;margin:16px 0;
  }

  .source-note{
    margin-top:30px;padding:16px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;font-size:12.5px;color:var(--text-dim);
    text-align:center;
  }
  .source-note a{ color:var(--topic);font-weight:700; }

    /* Home shortcut in header */
    .hdr-right{display:flex;align-items:center;gap:8px;}
    .home-btn{background:var(--surface);border:1px solid var(--border);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.05rem;line-height:1;color:var(--text);flex-shrink:0;}
    .home-btn:active{transform:scale(0.92);}
    .home-btn:focus-visible{outline:2px solid #0D9488;outline-offset:2px;}
  </style>
</head>
<body>


<div class="topbar">
  <a href="index.html" class="back-btn">←</a>
  <div class="topbar-title">Nk Study Lab</div>
  <div class="hdr-right"><a href="index.html" class="home-btn" aria-label="होम पेज पर जाओ" title="होम">🏠</a><button class="theme-toggle" id="themeToggle" aria-label="Theme Toggle">🌙</button><button type="button" class="nk-menu-btn" data-nk-menu aria-label="मेन्यू खोलो" title="मेन्यू">☰</button></div>
</div>

<div class="topic-banner">
  <div class="topic-emoji">💻</div>
  <h1 class="topic-title" style="margin:0">Coding क्या है?</h1>
  <div class="topic-sub">शुरुआत से, आसान हिंदी में</div>
</div>

<div class="post-wrap" id="postWrap">
  <div class="loading-text">पोस्ट लोड हो रही है...</div>
</div>

<script>
(function(){
  var BLOG_URL = "https://codeshieldnk.blogspot.com";
  // Blogger mein is post par "Coding-Post" label lagana zaroori hai
  var FILTER_LABEL = "Coding-Post";
  var FALLBACK_URL = "https://codeshieldnk.blogspot.com";

  function loadPost(){
    var url = BLOG_URL + "/feeds/posts/default/-/" + encodeURIComponent(FILTER_LABEL) + "?redirect=false&alt=json-in-script&max-results=1&callback=csRenderCodingPost";
    var script = document.createElement('script');
    script.src = url;
    script.onerror = function(){
      document.getElementById('postWrap').innerHTML = '<div class="loading-text">पोस्ट लोड नहीं हो पाई। इंटरनेट जाँचकर दोबारा खोलो, या <a href="'+FALLBACK_URL+'" target="_blank" rel="noopener" style="color:var(--topic);font-weight:700">Blogger पर पढ़ो</a>।</div>';
    };
    document.body.appendChild(script);
  }

  window.csRenderCodingPost = function(json){
    var container = document.getElementById('postWrap');
    if(!json || !json.feed || !json.feed.entry || json.feed.entry.length === 0){
      container.innerHTML = '<div class="loading-text">यह पोस्ट अभी उपलब्ध नहीं है। थोड़ी देर बाद देखो, या <a href="'+FALLBACK_URL+'" target="_blank" rel="noopener" style="color:var(--topic);font-weight:700">Blogger पर पढ़ो</a>।</div>';
      return;
    }

    var entry = json.feed.entry[0];
    var title = entry.title.$t;
    var link = FALLBACK_URL;
    for(var i=0;i<entry.link.length;i++){
      if(entry.link[i].rel === 'alternate'){ link = entry.link[i].href; break; }
    }
    var date = new Date(entry.published.$t).toLocaleDateString('en-IN', {day:'numeric', month:'long', year:'numeric'});
    var content = entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : '');

    container.innerHTML =
      '<div class="post-article-title">'+title+'</div>'
      + '<div class="post-article-date">📅 '+date+'</div>'
      + '<div class="post-article-body">'+content+'</div>'
      + '<div class="source-note">यह पोस्ट हमारी <a href="'+link+'" target="_blank" rel="noopener">Blogger वेबसाइट</a> से ली गई है।</div>';
  };

  loadPost();
})();


var themeToggle = document.getElementById('themeToggle');
var htmlEl = document.documentElement;

function updateToggleIcon(){
  var isDark = htmlEl.getAttribute('data-theme') === 'dark';
  themeToggle.textContent = isDark ? '☀️' : '🌙';
}
updateToggleIcon();

themeToggle.addEventListener('click', function(){
  var isDark = htmlEl.getAttribute('data-theme') === 'dark';
  if(isDark){
    htmlEl.removeAttribute('data-theme');
    localStorage.setItem('nkStudyLabTheme', 'light');
  } else {
    htmlEl.setAttribute('data-theme', 'dark');
    localStorage.setItem('nkStudyLabTheme', 'dark');
  }
  updateToggleIcon();
});
</script>

<script src="nav.js"></script>
</body>
</html>
