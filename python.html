<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python — Nk Study Lab</title>
<script>
  (function(){
    var saved = localStorage.getItem('nkStudyLabTheme');
    if(saved === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F7F8FA;
    --border:#E5E8EE;
    --text:#1A1F2B;
    --text-dim:#6B7280;
    --navbar-bg:rgba(255,255,255,0.92);
    --topic:#2563EB;
    --topic-dark:#1D4ED8;
  }
  [data-theme="dark"]{
    --bg:#0A0E14;
    --surface:#131A28;
    --border:#232B3D;
    --text:#E4E9F2;
    --text-dim:#8B96AC;
    --navbar-bg:rgba(10,14,20,0.92);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.6;
    transition:background .25s ease, color .25s ease;
  }
  a{text-decoration:none;color:inherit;}

  .loader-screen{
    position:fixed;inset:0;z-index:9999;
    background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;
    transition:opacity .4s ease, visibility .4s ease;
  }
  .loader-screen.hidden{ opacity:0;visibility:hidden;pointer-events:none; }
  .loader-logo{
    width:56px;height:56px;border-radius:50%;
    position:relative;display:flex;align-items:center;justify-content:center;
    font-size:24px;background:var(--surface);
  }
  .loader-logo::before{
    content:'';position:absolute;inset:-3px;border-radius:50%;
    background:conic-gradient(from 0deg,#0D9488,#F5A623,#9333EA,#16A34A,#DC2626,#0D9488);
    animation:spin 1.1s linear infinite;
  }
  .loader-logo::after{
    content:'';position:absolute;inset:0;border-radius:50%;background:var(--surface);
  }
  .loader-logo span{position:relative;z-index:1;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loader-text{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--text-dim);
  }

  .theme-toggle{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);
    border:1px solid var(--border);
    font-size:15px;cursor:pointer;
    margin-left:auto;
  }
  .theme-toggle:active{ transform:scale(0.92); }

  .topbar{
    position:sticky;top:0;z-index:50;
    background:var(--navbar-bg);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 18px;
    display:flex;align-items:center;gap:14px;
    transition:background .25s ease, border-color .25s ease;
  }
  .back-btn{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);
    font-size:16px;flex-shrink:0;
  }
  .topbar-title{
    font-family:'JetBrains Mono',monospace;
    font-weight:800;font-size:16px;
  }

  .topic-banner{
    background:linear-gradient(135deg,var(--topic),var(--topic-dark));
    padding:32px 20px;
    text-align:center;
    color:#fff;
  }
  .topic-emoji{font-size:40px;margin-bottom:10px;}
  .topic-title{
    font-family:'JetBrains Mono',monospace;
    font-weight:800;font-size:24px;margin-bottom:6px;
  }
  .topic-sub{font-size:13px;opacity:0.9;}

  /* POST CONTENT */
  .post-wrap{
    max-width:680px;margin:0 auto;
    padding:24px 20px 60px;
  }
  .loading-text{color:var(--text-dim);font-size:13px;text-align:center;padding:40px 0;}

  .post-article-title{
    font-size:21px;font-weight:800;color:var(--text);
    line-height:1.4;margin-bottom:10px;
  }
  .post-article-date{
    font-size:12px;color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    margin-bottom:22px;
    display:flex;align-items:center;gap:6px;
  }

  /* Blogger post HTML content ko site theme mein fit karna */
  .post-article-body{
    font-size:15px;color:var(--text);line-height:1.85;
  }
  .post-article-body p{ margin-bottom:16px; }
  .post-article-body img{
    max-width:100%;height:auto;border-radius:12px;margin:16px 0;
    display:block;
  }
  .post-article-body h1, .post-article-body h2, .post-article-body h3, .post-article-body h4{
    color:var(--text);font-weight:800;margin:24px 0 12px;line-height:1.4;
  }
  .post-article-body h2{ font-size:19px; }
  .post-article-body h3{ font-size:16.5px; }
  .post-article-body ul, .post-article-body ol{ margin:0 0 16px 20px; }
  .post-article-body li{ margin-bottom:8px; }
  .post-article-body a{ color:var(--topic);text-decoration:underline; }
  .post-article-body strong, .post-article-body b{ color:var(--text); }
  .post-article-body blockquote{
    border-left:3px solid var(--topic);
    background:var(--surface);
    padding:12px 16px;margin:16px 0;
    border-radius:0 8px 8px 0;
    color:var(--text-dim);
  }
  .post-article-body code{
    background:var(--surface);border:1px solid var(--border);
    padding:2px 6px;border-radius:5px;
    font-family:'JetBrains Mono',monospace;font-size:13px;
  }
  .post-article-body pre{
    background:var(--surface);border:1px solid var(--border);
    padding:14px;border-radius:10px;overflow-x:auto;margin:16px 0;
  }

  .source-note{
    margin-top:30px;padding:16px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;font-size:12.5px;color:var(--text-dim);
    text-align:center;
  }
  .source-note a{ color:var(--topic);font-weight:700; }
</style>
</head>
<body>

<div class="loader-screen" id="loaderScreen">
  <div class="loader-logo"><span>📚</span></div>
  <div class="loader-text">Load Ho Raha Hai...</div>
</div>

<div class="topbar">
  <a href="programming.html" class="back-btn">←</a>
  <div class="topbar-title">Nk Study Lab</div>
  <button class="theme-toggle" id="themeToggle" aria-label="Theme Toggle">🌙</button>
</div>

<div class="topic-banner">
  <div class="topic-emoji">🐍</div>
  <div class="topic-title">Python</div>
  <div class="topic-sub">Beginner friendly programming language</div>
</div>

<div class="post-wrap" id="postWrap">
  <div class="loading-text">Post load ho raha hai...</div>
</div>

<script>
(function(){
  var BLOG_URL = "https://codeshieldnk.blogspot.com";
  // Blogger mein is post par "Python-Post" label lagana zaroori hai
  var FILTER_LABEL = "Python-Post";
  var FALLBACK_URL = "https://codeshieldnk.blogspot.com/2026/07/python-kya-hai.html";

  function loadPost(){
    var url = BLOG_URL + "/feeds/posts/default/-/" + encodeURIComponent(FILTER_LABEL) + "?redirect=false&alt=json-in-script&max-results=1&callback=csRenderPythonPost";
    var script = document.createElement('script');
    script.src = url;
    script.onerror = function(){
      document.getElementById('postWrap').innerHTML = '<div class="loading-text">Post load nahi ho paaya.</div>';
    };
    document.body.appendChild(script);
  }

  window.csRenderPythonPost = function(json){
    var container = document.getElementById('postWrap');
    if(!json || !json.feed || !json.feed.entry || json.feed.entry.length === 0){
      container.innerHTML = '<div class="loading-text">Post abhi nahi mila — Blogger mein us post par "'+FILTER_LABEL+'" label lagana baaki hai.</div>';
      return;
    }

    var entry = json.feed.entry[0];
    var title = entry.title.$t;
    var link = FALLBACK_URL;
    for(var i=0;i<entry.link.length;i++){
      if(entry.link[i].rel === 'alternate'){ link = entry.link[i].href; break; }
    }
    var date = new Date(entry.published.$t).toLocaleDateString('en-IN', {day:'numeric', month:'long', year:'numeric'});
    var content = entry.content ? entry.content.$t : (entry.summary ? entry.summary.$t : '');

    container.innerHTML =
      '<div class="post-article-title">'+title+'</div>'
      + '<div class="post-article-date">📅 '+date+'</div>'
      + '<div class="post-article-body">'+content+'</div>'
      + '<div class="source-note">Ye post humari <a href="'+link+'" target="_blank" rel="noopener">Blogger website</a> se li gayi hai.</div>';
  };

  loadPost();
})();

window.addEventListener('load', function(){
  setTimeout(function(){
    document.getElementById('loaderScreen').classList.add('hidden');
  }, 400);
});

var themeToggle = document.getElementById('themeToggle');
var htmlEl = document.documentElement;

function updateToggleIcon(){
  var isDark = htmlEl.getAttribute('data-theme') === 'dark';
  themeToggle.textContent = isDark ? '☀️' : '🌙';
}
updateToggleIcon();

themeToggle.addEventListener('click', function(){
  var isDark = htmlEl.getAttribute('data-theme') === 'dark';
  if(isDark){
    htmlEl.removeAttribute('data-theme');
    localStorage.setItem('nkStudyLabTheme', 'light');
  } else {
    htmlEl.setAttribute('data-theme', 'dark');
    localStorage.setItem('nkStudyLabTheme', 'dark');
  }
  updateToggleIcon();
});
</script>

</body>
</html>
