<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gyan — Nk Study Lab</title>
<script>
  (function(){
    var saved = localStorage.getItem('nkStudyLabTheme');
    if(saved === 'dark'){
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#F7F8FA;
    --border:#E5E8EE;
    --text:#1A1F2B;
    --text-dim:#6B7280;
    --navbar-bg:rgba(255,255,255,0.92);
    --topic:#CA8A04;
    --topic-dark:#A16207;
  }
  [data-theme="dark"]{
    --bg:#0A0E14;
    --surface:#131A28;
    --border:#232B3D;
    --text:#E4E9F2;
    --text-dim:#8B96AC;
    --navbar-bg:rgba(10,14,20,0.92);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    line-height:1.6;
    transition:background .25s ease, color .25s ease;
  }
  a{text-decoration:none;color:inherit;}

  .loader-screen{
    position:fixed;inset:0;z-index:9999;
    background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;
    transition:opacity .4s ease, visibility .4s ease;
  }
  .loader-screen.hidden{ opacity:0;visibility:hidden;pointer-events:none; }
  .loader-logo{
    width:56px;height:56px;border-radius:50%;
    position:relative;display:flex;align-items:center;justify-content:center;
    font-size:24px;background:var(--surface);
  }
  .loader-logo::before{
    content:'';position:absolute;inset:-3px;border-radius:50%;
    background:conic-gradient(from 0deg,#0D9488,#F5A623,#9333EA,#16A34A,#DC2626,#0D9488);
    animation:spin 1.1s linear infinite;
  }
  .loader-logo::after{
    content:'';position:absolute;inset:0;border-radius:50%;background:var(--surface);
  }
  .loader-logo span{position:relative;z-index:1;}
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loader-text{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--text-dim);
  }

  .theme-toggle{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);
    border:1px solid var(--border);
    font-size:15px;cursor:pointer;
    margin-left:auto;
  }
  .theme-toggle:active{ transform:scale(0.92); }

  .topbar{
    position:sticky;top:0;z-index:50;
    background:var(--navbar-bg);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 18px;
    display:flex;align-items:center;gap:14px;
    transition:background .25s ease, border-color .25s ease;
  }
  .back-btn{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);
    font-size:16px;flex-shrink:0;
  }
  .topbar-title{
    font-family:'JetBrains Mono',monospace;
    font-weight:800;font-size:16px;
  }

  .topic-banner{
    background:linear-gradient(135deg,var(--topic),var(--topic-dark));
    padding:32px 20px;
    text-align:center;
    color:#fff;
  }
  .topic-emoji{font-size:40px;margin-bottom:10px;}
  .topic-title{
    font-family:'JetBrains Mono',monospace;
    font-weight:800;font-size:24px;margin-bottom:6px;
  }
  .topic-sub{font-size:13px;opacity:0.9;}

  .cat-wrap{
    max-width:640px;margin:0 auto;
    padding:20px 18px 6px;
  }
  .cat-heading{
    font-size:13px;font-weight:700;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:0.5px;
    margin-bottom:12px;
  }
  .cat-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
    margin-bottom:10px;
  }
  .cat-card{
    display:block;border-radius:14px;padding:18px 14px;
    position:relative;overflow:hidden;cursor:pointer;
    border:2px solid transparent;
    transition:transform .15s ease;
  }
  .cat-card:active{ transform:scale(0.96); }
  .cat-card.active{ border-color:#fff; box-shadow:0 0 0 2px var(--topic); }
  .cat-emoji{font-size:26px;display:block;margin-bottom:8px;}
  .cat-name{font-size:14px;font-weight:800;color:#fff;display:block;}
  .cat-sub{font-size:10.5px;color:rgba(255,255,255,0.8);margin-top:3px;display:block;}

  .c-adhyatmik{ background:linear-gradient(135deg,#CA8A04,#A16207); }
  .c-jeevan{ background:linear-gradient(135deg,#2563EB,#1D4ED8); }
  .c-motivation{ background:linear-gradient(135deg,#DC2626,#B91C1C); }
  .c-kahani{ background:linear-gradient(135deg,#16A34A,#15803D); }


  .posts-wrap{
    max-width:640px;margin:0 auto;
    padding:16px 18px 60px;
  }
  .posts-heading{
    font-size:14px;font-weight:700;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:0.5px;
    margin-bottom:14px;
  }
  .post-cards{display:flex;flex-direction:column;gap:16px;}
  .loading-text{color:var(--text-dim);font-size:13px;text-align:center;padding:30px 0;}

  .post-card{
    display:block;background:var(--surface);
    border:1px solid var(--border);border-radius:14px;overflow:hidden;
    transition:transform .18s, box-shadow .18s;
  }
  .post-card:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 28px -14px rgba(202,138,4,0.3);
  }
  .post-card-img{
    width:100%;aspect-ratio:16/9;object-fit:cover;display:block;
    background:linear-gradient(135deg,var(--topic),var(--topic-dark));
  }
  .post-card-body{padding:14px 16px;}
  .post-card-title{
    font-size:15px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:6px;
  }
  .post-card-date{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .post-card-arrow{
    display:inline-flex;align-items:center;gap:4px;
    color:var(--topic);font-size:12px;font-weight:700;margin-top:8px;
  }
</style>
</head>
<body>

<div class="loader-screen" id="loaderScreen">
  <div class="loader-logo"><span>📚</span></div>
  <div class="loader-text">Load Ho Raha Hai...</div>
</div>

<div class="topbar">
  <a href="index.html" class="back-btn">←</a>
  <div class="topbar-title">Nk Study Lab</div>
  <button class="theme-toggle" id="themeToggle" aria-label="Theme Toggle">🌙</button>
</div>

<div class="topic-banner">
  <div class="topic-emoji">🕉️</div>
  <div class="topic-title">Gyan</div>
  <div class="topic-sub">Adhyatmik aur jeevan gyan</div>
</div>

<div class="cat-wrap">
  <div class="cat-heading">📂 Category Chuno</div>
  <div class="cat-grid">
    <div class="cat-card c-adhyatmik active" data-cat="Gyan-Adhyatmik">
      <span class="cat-emoji">🕉️</span>
      <span class="cat-name">Adhyatmik Gyan</span>
      <span class="cat-sub">Spiritual samajh</span>
    </div>
    <div class="cat-card c-jeevan" data-cat="Gyan-Jeevan">
      <span class="cat-emoji">💡</span>
      <span class="cat-name">Jeevan Gyan</span>
      <span class="cat-sub">Zindagi ke sabak</span>
    </div>
    <div class="cat-card c-motivation" data-cat="Gyan-Motivation">
      <span class="cat-emoji">🔥</span>
      <span class="cat-name">Motivation</span>
      <span class="cat-sub">Aage badhte raho</span>
    </div>
    <div class="cat-card c-kahani" data-cat="Gyan-Kahaniyan">
      <span class="cat-emoji">📜</span>
      <span class="cat-name">Kahaniyan</span>
      <span class="cat-sub">Sikhane wali kahaniyan</span>
    </div>

  </div>
</div>

<div class="posts-wrap">
  <div class="posts-heading" id="postsHeading">🕉️ Adhyatmik Gyan Posts</div>
  <div class="post-cards" id="postCards">
    <div class="loading-text">Loading posts...</div>
  </div>
</div>

<script>
(function(){
  var BLOG_URL = "https://codeshieldnk.blogspot.com";
  var MAX_POSTS = 20;

  var headingMap = {
    "Gyan-Adhyatmik": "🕉️ Adhyatmik Gyan Posts",
    "Gyan-Jeevan": "💡 Jeevan Gyan Posts",
    "Gyan-Motivation": "🔥 Motivation Posts",
    "Gyan-Kahaniyan": "📜 Kahaniyan Posts"
  };

  function loadPosts(label){
    document.getElementById('postsHeading').textContent = headingMap[label] || "Posts";
    var container = document.getElementById('postCards');
    container.innerHTML = '<div class="loading-text">Loading posts...</div>';
    var url = BLOG_URL + "/feeds/posts/default/-/" + encodeURIComponent(label) + "?redirect=false&alt=json-in-script&max-results=" + MAX_POSTS + "&callback=csRenderPosts";
    var script = document.createElement('script');
    script.src = url;
    script.onerror = function(){
      container.innerHTML = '<div class="loading-text">Posts load nahi ho paaye.</div>';
    };
    document.body.appendChild(script);
  }

  function getPostImage(entry){
    if(entry.media$thumbnail && entry.media$thumbnail.url){
      return entry.media$thumbnail.url.replace(/\/s72-c\//, '/s600/').replace(/\/w72-h72-/, '/w600-');
    }
    var content = (entry.content && entry.content.$t) || (entry.summary && entry.summary.$t) || '';
    var match = content.match(/<img[^>]+src="([^">]+)"/i);
    if(match && match[1]) return match[1];
    return null;
  }

  window.csRenderPosts = function(json){
    var container = document.getElementById('postCards');
    if(!json || !json.feed || !json.feed.entry || json.feed.entry.length === 0){
      container.innerHTML = '<div class="loading-text">Abhi koi post nahi mila. Jald aayega!</div>';
      return;
    }
    var html = '';
    json.feed.entry.forEach(function(entry){
      var title = entry.title.$t;
      var link = '#';
      for(var i=0;i<entry.link.length;i++){
        if(entry.link[i].rel === 'alternate'){ link = entry.link[i].href; break; }
      }
      var date = new Date(entry.published.$t).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
      var img = getPostImage(entry);
      var imgHtml = img
        ? '<img class="post-card-img" src="'+img+'" alt="'+title.replace(/"/g,'&quot;')+'" loading="lazy">'
        : '<div class="post-card-img"></div>';

      html += '<a class="post-card" href="'+link+'" target="_blank" rel="noopener">'
            +   imgHtml
            +   '<div class="post-card-body">'
            +     '<div class="post-card-title">'+title+'</div>'
            +     '<div class="post-card-date">'+date+'</div>'
            +     '<div class="post-card-arrow">Padho &rarr;</div>'
            +   '</div>'
            + '</a>';
    });
    container.innerHTML = html;
  };

  loadPosts('Gyan-Adhyatmik');

  var catCards = document.querySelectorAll('.cat-card');
  catCards.forEach(function(card){
    card.addEventListener('click', function(){
      var cat = card.getAttribute('data-cat');
      if(!cat) return;
      catCards.forEach(function(c){ c.classList.remove('active'); });
      card.classList.add('active');
      loadPosts(cat);
    });
  });
})();

window.addEventListener('load', function(){
  setTimeout(function(){
    document.getElementById('loaderScreen').classList.add('hidden');
  }, 400);
});

var themeToggle = document.getElementById('themeToggle');
var htmlEl = document.documentElement;

function updateToggleIcon(){
  var isDark = htmlEl.getAttribute('data-theme') === 'dark';
  themeToggle.textContent = isDark ? '☀️' : '🌙';
}
updateToggleIcon();

themeToggle.addEventListener('click', function(){
  var isDark = htmlEl.getAttribute('data-theme') === 'dark';
  if(isDark){
    htmlEl.removeAttribute('data-theme');
    localStorage.setItem('nkStudyLabTheme', 'light');
  } else {
    htmlEl.setAttribute('data-theme', 'dark');
    localStorage.setItem('nkStudyLabTheme', 'dark');
  }
  updateToggleIcon();
});
</script>

</body>
</html>
