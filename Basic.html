            gap: 8px;

            padding: 13px 16px;
            border-radius: 12px;
            border: 2px solid var(--border-card);
            background-color: var(--bg-card);
            color: var(--text-main);
            font-size: 15px;
            font-family: var(--font-sans);
            outline: none;
            margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
        }

        .search-box:focus {
            border-color: var(--blue-primary);
        }

        /* Sentence Cards List */
        .sentence-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sentence-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-left: 5px solid var(--blue-primary);
            border-radius: 12px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow-sm);
        }

        .sentence-number {
            background-color: var(--blue-primary);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            min-width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-family: var(--font-mono);
        }

        .sentence-content {
            flex-grow: 1;
        }

        .english-text {
            font-size: 16px;
            font-weight: 700;
            color: var(--blue-primary);
            margin-bottom: 4px;
            font-family: var(--font-sans);
        }

        .hindi-text {
            font-size: 15px;
            color: var(--text-sub);
            font-family: var(--font-sans);

        .speak-btn {

            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .speak-btn:hover {
            color: var(--blue-primary);
            background-color: var(--blue-light);
        }

        .no-result {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-family: var(--font-sans);

</head>

        // Render Sentences
        function renderSentences(data) {
            const container = document.getElementById('sentencesList');
            if (data.length === 0) {
                container.innerHTML = `<div class="no-result">Koi vakya nahi mila (No matching sentence found)</div>`;
                return;
            }

            container.innerHTML = data.map((item, index) => `
                <div class="sentence-card">
                    <div class="sentence-number">${index + 1}</div>
                    <div class="sentence-content">
                        <div class="english-text">${item.en}</div>
                        <div class="hindi-text">${item.hi}</div>
                    </div>
                    <button class="speak-btn" onclick="speakSentence('${item.en.replace(/'/g, "\\'")}')" title="Pronunciation sunein">🔊</button>
                </div>
            `).join('');
        }

        // Live Search Filter
        function filterSentences() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = sentences100.filter(s => 
                s.en.toLowerCase().includes(query) || s.hi.toLowerCase().includes(query)
            );
            renderSentences(filtered);
        }

        // Text-to-Speech API
        function speakSentence(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Dark / Light Theme Toggle
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
        }

        // Back Button Handler
        function handleBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '#';
            }
        }

        // On Page Load
        window.onload = () => {
            renderSentences(sentences100);
        };
